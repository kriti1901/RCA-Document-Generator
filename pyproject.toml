[project]
name = "rca-agent"
version = "0.1.0"
description = "Multi-agent RCA document generator: raw incident notes to a structured PDF stored in Confluence"
requires-python = ">=3.11"
dependencies = [
  "openai>=3.49",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "pydantic>=2.9",
  "streamlit[pdf]>=1.67",
  "jinja2>=3.1",
  "weasyprint>=70",
  "httpx>=0.28",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pypdf>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rca*"]

[tool.setuptools.package-data]
rca = ["render/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
